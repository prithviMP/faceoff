[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "faceoff-lab"
version = "0.2.0"
description = "Build and inspect retrieval and OKF knowledge systems on your own datasets"
requires-python = ">=3.11"
license = "MIT"
dependencies = ["streamlit>=1.50,<2", "numpy>=2.2,<3", "rank-bm25==0.2.2", "PyYAML>=6,<7", "python-dotenv>=1,<2"]

[project.optional-dependencies]
semantic = ["sentence-transformers>=5.1,<6"]
gemini = ["google-genai>=1.45,<2"]
pdf = ["pypdf>=6,<7"]
dev = ["pytest>=8,<9", "ruff>=0.12,<1"]

[project.scripts]
faceoff = "faceoff_lab.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
faceoff_lab = ["examples/**/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 110

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]
